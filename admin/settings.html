<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Impostazioni - Franklin Admin</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@400;500;600;700&family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/vintage-theme.css">
    <link rel="stylesheet" href="../css/admin.css">
    <!-- Blocco anti-fouc e Auth -->
    <style id="anti-fouc">html { display: none !important; }</style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        if (window.FranklinApp && window.FranklinApp.Auth) {
            if (!window.FranklinApp.Auth.isAutenticato()) {
                window.location.href = 'login.html';
            } else {
                document.getElementById('anti-fouc').remove();
                window.FranklinApp.Auth.verificaAccesso();
            }
        }
    </script>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <script src="../js/components/sidebar.js"></script>

        <!-- Main Content -->
        <main class="main-content" style="padding: 2rem; overflow-y: auto;">
            <div class="admin-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 class="vintage-title" style="font-size: 2rem; color: var(--color-text-cream); margin-bottom: 0.2rem;">Impostazioni Generali</h1>
                </div>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 2rem;">
                
                <!-- Section 1: Informazioni Negozio -->
                <div class="vintage-card admin-form">
                    <h3 class="vintage-title" style="color: var(--color-brass-base); margin-bottom: 1rem;">Informazioni Negozio 💈</h3>
                    <form id="form-info-negozio" onsubmit="event.preventDefault(); salvaInfoNegozio();">
                        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Nome Negozio</label>
                                <input type="text" id="info-nome" class="vintage-input" style="width: 100%;">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Telefono</label>
                                <input type="text" id="info-telefono" class="vintage-input" style="width: 100%;">
                            </div>
                        </div>
                        <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Indirizzo</label>
                                <input type="text" id="info-indirizzo" class="vintage-input" style="width: 100%;">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Email</label>
                                <input type="email" id="info-email" class="vintage-input" style="width: 100%;">
                            </div>
                        </div>
                        <button type="submit" class="btn-primary">Salva Informazioni</button>
                    </form>
                </div>

                <!-- Section 2: Ruoli e Permessi -->
                <div class="vintage-card admin-form">
                    <h3 class="vintage-title" style="color: var(--color-brass-base); margin-bottom: 1rem;">Ruoli e Permessi 🛡️</h3>
                    <div class="admin-tabella-container">
                        <table class="admin-tabella" style="width: 100%;">
                            <thead>
                                <tr>
                                    <th>ID Ruolo</th>
                                    <th>Nome</th>
                                    <th>Permessi</th>
                                </tr>
                            </thead>
                            <tbody id="tabella-ruoli-body">
                                <tr>
                                    <td colspan="3" style="text-align: center;">Caricamento in corso...</td>
                                </tr>
                            </tbody>
                        </table>
                    </div>
                </div>
                <!-- Section 4: Sicurezza -->
                <div class="vintage-card admin-form">
                    <h3 class="vintage-title" style="color: var(--color-brass-base); margin-bottom: 1rem;">Sicurezza 🔒</h3>
                    <form id="form-password" onsubmit="event.preventDefault(); cambiaPassword();">
                        <div class="form-group" style="margin-bottom: 1rem;">
                            <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Vecchia Password</label>
                            <input type="password" id="pass-vecchia" class="vintage-input" required style="width: 100%; max-width: 400px;">
                        </div>
                        <div class="form-group" style="margin-bottom: 1rem;">
                            <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Nuova Password</label>
                            <input type="password" id="pass-nuova" class="vintage-input" required style="width: 100%; max-width: 400px;">
                        </div>
                        <div class="form-group" style="margin-bottom: 1.5rem;">
                            <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Conferma Nuova Password</label>
                            <input type="password" id="pass-conferma" class="vintage-input" required style="width: 100%; max-width: 400px;">
                        </div>
                        <button type="submit" class="btn-primary">Aggiorna Password</button>
                    </form>
                </div>
                
                <!-- Section 5: Backup & Ripristino -->
                <div class="vintage-card admin-form" style="border: 1px solid var(--color-danger);">
                    <h3 class="vintage-title" style="color: var(--color-danger); margin-bottom: 1rem;">Sistema & Dati 💾</h3>
                    <div style="display: flex; gap: 1rem; align-items: center; margin-bottom: 1.5rem;">
                        <button class="btn-primary" onclick="if(window.FranklinApp && window.FranklinApp.Admin) window.FranklinApp.Admin.esportaBackup()">Esporta Backup JSON</button>
                        
                        <div style="position: relative;">
                            <input type="file" id="import-file" style="display: none;" accept=".json" onchange="gestisciImport(this)">
                            <button class="btn-secondary" onclick="document.getElementById('import-file').click()">Importa Backup</button>
                        </div>
                    </div>
                    
                    <div class="brass-divider" style="margin: 1.5rem 0;"></div>
                    
                    <div>
                        <p style="font-family: var(--font-admin); color: var(--color-text-cream); margin-bottom: 1rem; font-size: 0.9rem;">Attenzione: il ripristino dei dati cancellerà tutte le modifiche apportate e ricaricherà i dati mock originali.</p>
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <button class="btn-danger" onclick="resettaDati()">Resetta Dati Iniziali</button>
                            <button class="btn-primary" onclick="salvaValoriIniziali()">Salva Valori Iniziali</button>
                        </div>
                    </div>
                </div>
                
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/mock-data.js"></script>
    <script src="../js/public.js"></script>
    <script src="../js/admin.js"></script>
    
        <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.FranklinApp && window.FranklinApp.Auth && !window.FranklinApp.Auth.isAutenticato()) {
                window.location.href = 'login.html';
                return;
            }
            
            popolaImpostazioni();
            caricaRuoli();
        });

        async function caricaRuoli() {
            if (window.FranklinApp && window.FranklinApp.Storage && window.FranklinApp.Storage.supabase) {
                const sb = window.FranklinApp.Storage.supabase;
                const { data: ruoli, error } = await sb.from('ruoli').select('*').order('nome', { ascending: true });
                
                const tbody = document.getElementById('tabella-ruoli-body');
                if (!tbody) return;
                
                if (error) {
                    console.error("Errore recupero ruoli:", error);
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center; color: var(--color-danger);">Errore nel caricamento dei ruoli</td></tr>`;
                    return;
                }
                
                if (!ruoli || ruoli.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" style="text-align: center;">Nessun ruolo trovato</td></tr>`;
                    return;
                }
                
                tbody.innerHTML = ruoli.map(r => `
                    <tr style="border-bottom: 1px solid var(--color-wood-200);">
                        <td style="padding: 1rem; color: var(--color-brass-dark); font-family: var(--font-typewriter);">${r.id}</td>
                        <td style="padding: 1rem; font-weight: bold;">${r.nome}</td>
                        <td style="padding: 1rem;">
                            <div style="display: flex; flex-wrap: wrap; gap: 5px;">
                                ${(r.permessi || []).map(p => `<span class="badge" style="background-color: var(--color-wood-300); color: white; padding: 3px 8px; font-size: 0.8rem; border-radius: 12px;">${p}</span>`).join('')}
                            </div>
                        </td>
                    </tr>
                `).join('');
            } else {
                // Fallback in caso Supabase non sia pronto o in uso localStorage (mock)
                document.getElementById('tabella-ruoli-body').innerHTML = `<tr><td colspan="3" style="text-align: center;">Dati Supabase non disponibili</td></tr>`;
            }
        }

        function popolaImpostazioni() {
            if(window.FranklinApp && window.FranklinApp.Storage) {
                const imp = window.FranklinApp.Storage.ottieniImpostazioni();
                if(imp) {
                    document.getElementById('info-nome').value = imp.nomeNegozio || '';
                    document.getElementById('info-telefono').value = imp.telefono || '';
                    document.getElementById('info-indirizzo').value = imp.indirizzo || '';
                    document.getElementById('info-email').value = imp.email || '';
                }
            }
        }

        function salvaInfoNegozio() {
            if(window.FranklinApp && window.FranklinApp.Storage) {
                const imp = window.FranklinApp.Storage.ottieniImpostazioni();
                imp.nomeNegozio = document.getElementById('info-nome').value;
                imp.telefono = document.getElementById('info-telefono').value;
                imp.indirizzo = document.getElementById('info-indirizzo').value;
                imp.email = document.getElementById('info-email').value;
                window.FranklinApp.Storage.salvaImpostazioni(imp);
                if(window.FranklinApp.Admin) window.FranklinApp.Admin.mostraToast("Informazioni salvate", "successo");
            }
        }

        function cambiaPassword() {
            const v = document.getElementById('pass-vecchia').value;
            const n = document.getElementById('pass-nuova').value;
            const c = document.getElementById('pass-conferma').value;
            
            if(n !== c) {
                if(window.FranklinApp && window.FranklinApp.Admin) window.FranklinApp.Admin.mostraToast("Le password non coincidono", "errore");
                return;
            }
            
            if(window.FranklinApp && window.FranklinApp.Auth) {
                const res = window.FranklinApp.Auth.cambiaPassword(v, n);
                if(res) {
                    if(window.FranklinApp.Admin) window.FranklinApp.Admin.mostraToast("Password aggiornata", "successo");
                    document.getElementById('form-password').reset();
                } else {
                    if(window.FranklinApp.Admin) window.FranklinApp.Admin.mostraToast("Vecchia password errata", "errore");
                }
            }
        }

function gestisciImport(input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    if (window.FranklinApp && window.FranklinApp.Storage) {
                        try {
                            const content = e.target.result;
                            const res = window.FranklinApp.Storage.importaTutto(content);
                            if(res) {
                                if(window.FranklinApp.Admin) window.FranklinApp.Admin.mostraToast("Backup importato con successo!", "successo");
                                setTimeout(() => location.reload(), 1500);
                            } else {
                                if(window.FranklinApp.Admin) window.FranklinApp.Admin.mostraToast("Errore durante l'importazione", "errore");
                            }
                        } catch (error) {
                            if(window.FranklinApp.Admin) window.FranklinApp.Admin.mostraToast("Errore formato file", "errore");
                            console.error(error);
                        }
                    }
                };
                reader.readAsText(input.files[0]);
            }
        }

        function salvaValoriIniziali() {
            if (confirm("Vuoi impostare i dati attuali come valori di default per i futuri reset?")) {
                if (window.FranklinApp && window.FranklinApp.Storage) {
                    const dati = {
                        servizi: window.FranklinApp.Storage.ottieniServizi(),
                        barbieri: window.FranklinApp.Storage.ottieniBarbieri(),
                        appuntamenti: window.FranklinApp.Storage.ottieniAppuntamenti(),
                        impostazioni: window.FranklinApp.Storage.ottieniImpostazioni(),
                        auth: window.FranklinApp.Storage.ottieniAuth()
                    };
                    localStorage.setItem('Franklin_DatiIniziali_Custom', JSON.stringify(dati));
                    if(window.FranklinApp.Admin) window.FranklinApp.Admin.mostraToast("Valori iniziali salvati con successo!", "successo");
                }
            }
        }

        function resettaDati() {
            if (confirm("Sei sicuro di voler resettare tutti i dati? Questa operazione è irreversibile.")) {
                const customInitial = localStorage.getItem('Franklin_DatiIniziali_Custom');
                localStorage.clear();
                if(customInitial) localStorage.setItem('Franklin_DatiIniziali_Custom', customInitial);
                
                if (window.FranklinApp && window.FranklinApp.Storage) {
                    window.FranklinApp.Storage.inizializza();
                }
                alert("Dati resettati con successo.");
                location.reload();
            }
        }
    </script>
</body>
</html>
