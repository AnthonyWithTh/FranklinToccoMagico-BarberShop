<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Utenti - Franklin Admin</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@400;500;600;700&family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/variables.css?v=639214773924878610">
    <link rel="stylesheet" href="../css/global.css?v=639214773924878610">
    <link rel="stylesheet" href="../css/vintage-theme.css?v=639214773924878610">
    <link rel="stylesheet" href="../css/admin.css?v=639214773924878610">
    <!-- Blocco anti-fouc e Auth -->
    <style id="anti-fouc">html { display: none !important; }</style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/storage.js?v=639214773924878610"></script>
    <script src="../js/auth.js?v=639214773924878610"></script>
    <script>
        if (window.FranklinApp && window.FranklinApp.Auth) {
            if (!window.FranklinApp.Auth.isAutenticato()) {
                window.location.href = 'login.html';
            } else {
                document.getElementById('anti-fouc').remove();
                window.FranklinApp.Auth.verificaAccesso();
            }
        }
    </script>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <script src="../js/components/sidebar.js?v=639214773924878610"></script>

        <!-- Main Content -->
        <main class="main-content" style="padding: 2rem; overflow-y: auto;">
            <div class="admin-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 class="vintage-title" style="font-size: 2rem; color: var(--color-text-cream); margin-bottom: 0.2rem;">Amministrazione</h1>
                </div>
            </div>
            
            <!-- Vista Utenti -->
            <div id="vista-utenti" class="vintage-card admin-form" style="padding: 1.5rem; margin-bottom: 2rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h4 style="color: var(--color-text-cream); margin: 0; font-family: var(--font-vintage);">Utenti</h4>
                    <button class="btn-primary" onclick="apriModaleUtente()">
                        + Nuovo Utente
                    </button>
                </div>
                <table class="admin-tabella" style="width: 100%;">
                    <thead>
                        <tr>
                            <th>Nome e Cognome</th>
                            <th>Username</th>
                            <th style="width: 200px;">Password</th>
                            <th>Ruolo</th>
                            <th>Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="utenti-tbody">
                        <!-- Popolato da JS -->
                    </tbody>
                </table>
            </div>

            <!-- Vista Ruoli -->
            <div id="vista-ruoli" class="vintage-card admin-form" style="padding: 1.5rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem;">
                    <h4 style="color: var(--color-text-cream); margin: 0; font-family: var(--font-vintage);">Ruoli e Permessi</h4>
                    <button class="btn-primary" onclick="apriModaleRuolo()">
                        + Nuovo Ruolo
                    </button>
                </div>
                <table class="admin-tabella" style="width: 100%;">
                    <thead>
                        <tr>
                            <th>Nome Ruolo</th>
                            <th style="text-align: center;">Agenda</th>
                            <th style="text-align: center;">Servizi</th>
                            <th style="text-align: center;">Orario Lavoro</th>
                            <th style="text-align: center;">Staff</th>
                            <th style="text-align: center;">Impostazioni</th>
                            <th style="text-align: center;">Amministrazione</th>
                            <th style="text-align: center;">Vetrina</th>
                            <th style="text-align: center;">Personale</th>
                            <th>Azioni</th>
                        </tr>
                    </thead>
                    <tbody id="ruoli-tbody">
                        <!-- Popolato da JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>
    
    <!-- Modale Utente -->
    <div id="modale-utente" class="modal-overlay" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000;">
        <div class="modal-content vintage-card admin-form" style="width: 90%; max-width: 500px; padding: 2rem;">
            <h2 id="modale-utente-titolo" class="vintage-title" style="margin-top: 0; color: var(--color-text-cream); border-bottom: 1px solid var(--color-brass-dark); padding-bottom: 0.5rem;">Aggiungi Utente</h2>
            
            <form id="form-utente" onsubmit="event.preventDefault(); salvaUtente();">
                <input type="hidden" id="utente-id">
                
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label class="vintage-label">Nome</label>
                        <input type="text" id="utente-nome" class="vintage-input" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label class="vintage-label">Cognome</label>
                        <input type="text" id="utente-cognome" class="vintage-input" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 1rem;">
                    <label class="vintage-label">Username</label>
                    <input type="text" id="utente-username" class="vintage-input" required>
                </div>
                
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label class="vintage-label" id="utente-password-label">Password</label>
                    <div style="position: relative;">
                        <input type="password" id="utente-password" class="vintage-input" style="width: 100%; padding-right: 40px;">
                        <button type="button" id="toggle-modale-pwd-btn" onclick="toggleModalPassword()" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); background: none; border: none; cursor: pointer; font-size: 1.2rem; color: var(--color-text-muted); padding: 0;">👁️</button>
                    </div>
                    <small style="color: var(--color-text-muted); display: block; margin-top: 5px;">Lascia vuoto per non modificare la password (se in modifica)</small>
                </div>
                
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="vintage-label">Ruolo</label>
                    <select id="utente-ruoloId" class="vintage-select" required>
                        <!-- Popolato da JS -->
                    </select>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn-secondary" style="flex: 1;" onclick="chiudiModaleUtente()">Annulla</button>
                    <button type="submit" class="btn-primary" style="flex: 1;">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Modale Ruolo -->
    <div id="modale-ruolo" class="modal-overlay" style="display: none; align-items: center; justify-content: center; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1000;">
        <div class="modal-content vintage-card admin-form" style="width: 90%; max-width: 500px; padding: 2rem;">
            <h2 id="modale-ruolo-titolo" class="vintage-title" style="margin-top: 0; color: var(--color-text-cream); border-bottom: 1px solid var(--color-brass-dark); padding-bottom: 0.5rem;">Aggiungi Ruolo</h2>
            
            <form id="form-ruolo" onsubmit="event.preventDefault(); salvaRuolo();">
                <input type="hidden" id="ruolo-id">
                
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="vintage-label">Nome Ruolo</label>
                    <input type="text" id="ruolo-nome" class="vintage-input" required>
                </div>
                
                <div class="form-group" style="margin-bottom: 1.5rem;">
                    <label class="vintage-label">Permessi di Accesso (Sezioni Visibili)</label>
                    <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px;">
                        <label style="color: var(--color-text-cream); display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" name="ruolo-permessi" value="appointments"> Agenda
                        </label>
                        <label style="color: var(--color-text-cream); display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" name="ruolo-permessi" value="services"> Servizi
                        </label>
                        <label style="color: var(--color-text-cream); display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" name="ruolo-permessi" value="schedule"> Orario di Lavoro
                        </label>
                        <label style="color: var(--color-text-cream); display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" name="ruolo-permessi" value="barbers"> Staff
                        </label>
                        <label style="color: var(--color-text-cream); display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" name="ruolo-permessi" value="settings"> Impostazioni
                        </label>
                        <label style="color: var(--color-text-cream); display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" name="ruolo-permessi" value="users"> Amministrazione
                        </label>
                        <label style="color: var(--color-text-cream); display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" name="ruolo-permessi" value="vetrina"> Vetrina
                        </label>
                        <label style="color: var(--color-text-cream); display: flex; align-items: center; gap: 8px;">
                            <input type="checkbox" name="ruolo-permessi" value="personale"> Personale
                        </label>
                    </div>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-top: 2rem;">
                    <button type="button" class="btn-secondary" style="flex: 1;" onclick="chiudiModaleRuolo()">Annulla</button>
                    <button type="submit" class="btn-primary" style="flex: 1;">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Container Toast -->
    <div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; display: flex; flex-direction: column; gap: 10px; z-index: 9999;"></div>

    <!-- Scripts -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            caricaUtenti();
            caricaRuoli();
            popolaSelectRuoli();
        });

        // --- GESTIONE UTENTI ---

        function toggleModalPassword() {
            const pwdInput = document.getElementById('utente-password');
            const btn = document.getElementById('toggle-modale-pwd-btn');
            if (pwdInput.type === 'password') {
                pwdInput.type = 'text';
                btn.textContent = '🙈';
            } else {
                pwdInput.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function togglePasswordInTable(userId) {
            const pwdField = document.getElementById('pwd-' + userId);
            const btn = document.getElementById('btn-pwd-' + userId);
            const authData = window.FranklinApp.Storage.ottieniAuth();
            const utente = authData.utenti.find(u => u.id === userId);
            
            if (pwdField.textContent === '••••••••') {
                pwdField.textContent = utente.password;
                btn.textContent = '🙈';
            } else {
                pwdField.textContent = '••••••••';
                btn.textContent = '👁️';
            }
        }

        function caricaUtenti() {
            const authData = window.FranklinApp.Storage.ottieniAuth();
            const utenti = authData.utenti || [];
            const ruoli = authData.ruoli || [];
            const tbody = document.getElementById('utenti-tbody');
            tbody.innerHTML = '';
            
            utenti.forEach(utente => {
                const ruolo = ruoli.find(r => r.id === utente.ruoloId);
                const ruoloNome = ruolo ? ruolo.nome : 'Nessun Ruolo';
                const badgeClass = ruoloNome === 'Amministratore' ? 'badge-confirmed' : 'badge-completed';
                
                const fullName = `${utente.nome || ''} ${utente.cognome || ''}`.trim() || '-';
                
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: bold;">${fullName}</td>
                        <td style="color: var(--color-brass-light);">${utente.username}</td>
                        <td style="white-space: nowrap;">
                            <span style="font-family: monospace; display: inline-block; width: 120px; overflow: hidden; text-overflow: ellipsis; vertical-align: middle;" id="pwd-${utente.id}">••••••••</span>
                            <button id="btn-pwd-${utente.id}" onclick="togglePasswordInTable('${utente.id}')" style="background: none; border: none; cursor: pointer; color: var(--color-text-muted); padding: 0 5px; vertical-align: middle;">👁️</button>
                        </td>
                        <td><span class="badge ${badgeClass}">${ruoloNome}</span></td>
                        <td>
                            <button class="azioni-btn" onclick="modificaUtente('${utente.id}')" title="Modifica">✏️</button>
                            ${utente.username !== 'admin' ? `<button class="azioni-btn btn-danger" onclick="eliminaUtente('${utente.id}')" title="Elimina">🗑️</button>` : ''}
                        </td>
                    </tr>
                `;
            });
        }

        function popolaSelectRuoli() {
            const authData = window.FranklinApp.Storage.ottieniAuth();
            const ruoli = authData.ruoli || [];
            const select = document.getElementById('utente-ruoloId');
            select.innerHTML = '';
            ruoli.forEach(r => {
                select.innerHTML += `<option value="${r.id}">${r.nome}</option>`;
            });
        }

        function apriModaleUtente() {
            document.getElementById('form-utente').reset();
            document.getElementById('utente-id').value = '';
            document.getElementById('modale-utente-titolo').textContent = "Aggiungi Utente";
            document.getElementById('utente-password').required = true;
            document.getElementById('utente-username').disabled = false;
            popolaSelectRuoli();
            document.getElementById('modale-utente').style.display = 'flex';
        }

        function chiudiModaleUtente() {
            document.getElementById('modale-utente').style.display = 'none';
        }

        function modificaUtente(id) {
            const authData = window.FranklinApp.Storage.ottieniAuth();
            const utente = (authData.utenti || []).find(u => u.id === id);
            
            if (!utente) return;

            document.getElementById('form-utente').reset();
            document.getElementById('utente-id').value = utente.id;
            document.getElementById('utente-nome').value = utente.nome || '';
            document.getElementById('utente-cognome').value = utente.cognome || '';
            document.getElementById('utente-username').value = utente.username;
            document.getElementById('utente-username').disabled = (utente.username === 'admin');
            
            document.getElementById('utente-password').required = false;
            
            popolaSelectRuoli();
            document.getElementById('utente-ruoloId').value = utente.ruoloId;
            
            document.getElementById('modale-utente-titolo').textContent = "Modifica Utente";
            document.getElementById('modale-utente').style.display = 'flex';
        }

        function salvaUtente() {
            const id = document.getElementById('utente-id').value;
            const nome = document.getElementById('utente-nome').value;
            const cognome = document.getElementById('utente-cognome').value;
            const username = document.getElementById('utente-username').value;
            const password = document.getElementById('utente-password').value;
            const ruoloId = document.getElementById('utente-ruoloId').value;
            
            const authData = window.FranklinApp.Storage.ottieniAuth();
            if (!authData.utenti) authData.utenti = [];

            if (id) {
                // Modifica
                const index = authData.utenti.findIndex(u => u.id === id);
                if (index !== -1) {
                    authData.utenti[index].nome = nome;
                    authData.utenti[index].cognome = cognome;
                    if (authData.utenti[index].username !== 'admin') {
                        authData.utenti[index].username = username;
                    }
                    if (password) {
                        authData.utenti[index].password = password;
                    }
                    authData.utenti[index].ruoloId = ruoloId;
                }
            } else {
                // Nuovo
                if (authData.utenti.find(u => u.username === username)) {
                    mostraToast("Username già in uso", "errore");
                    return;
                }
                
                authData.utenti.push({
                    id: 'usr_' + Date.now(),
                    nome: nome,
                    cognome: cognome,
                    username: username,
                    password: password,
                    ruoloId: ruoloId
                });
            }

            window.FranklinApp.Storage.salvaAuth(authData);
            chiudiModaleUtente();
            caricaUtenti();
            mostraToast("Utente salvato con successo", "successo");
        }

        function eliminaUtente(id) {
            if (!confirm("Sei sicuro di voler eliminare questo utente?")) return;
            
            const authData = window.FranklinApp.Storage.ottieniAuth();
            if (authData.utenti) {
                authData.utenti = authData.utenti.filter(u => u.id !== id);
                window.FranklinApp.Storage.salvaAuth(authData);
                caricaUtenti();
                mostraToast("Utente eliminato", "successo");
            }
        }

        // --- GESTIONE RUOLI ---

        function caricaRuoli() {
            const authData = window.FranklinApp.Storage.ottieniAuth();
            const ruoli = authData.ruoli || [];
            const tbody = document.getElementById('ruoli-tbody');
            tbody.innerHTML = '';
            
            const hasPerm = (perms, target) => (perms && perms.includes(target)) ? '✅' : '<span style="color: #444;">-</span>';

            ruoli.forEach(ruolo => {
                const isSystem = (ruolo.id === 'ruolo_admin' || ruolo.nome === 'Amministratore');
                
                tbody.innerHTML += `
                    <tr>
                        <td style="font-weight: bold; color: var(--color-brass-light);">${ruolo.nome}</td>
                        <td style="text-align: center;">${hasPerm(ruolo.permessi, 'appointments')}</td>
                        <td style="text-align: center;">${hasPerm(ruolo.permessi, 'services')}</td>
                        <td style="text-align: center;">${hasPerm(ruolo.permessi, 'schedule')}</td>
                        <td style="text-align: center;">${hasPerm(ruolo.permessi, 'barbers')}</td>
                        <td style="text-align: center;">${hasPerm(ruolo.permessi, 'settings')}</td>
                        <td style="text-align: center;">${hasPerm(ruolo.permessi, 'users')}</td>
                        <td style="text-align: center;">${hasPerm(ruolo.permessi, 'vetrina')}</td>
                        <td style="text-align: center;">${hasPerm(ruolo.permessi, 'personale')}</td>
                        <td>
                            <button class="azioni-btn" onclick="modificaRuolo('${ruolo.id}')" title="Modifica">✏️</button>
                            ${!isSystem ? `<button class="azioni-btn btn-danger" onclick="eliminaRuolo('${ruolo.id}')" title="Elimina">🗑️</button>` : ''}
                        </td>
                    </tr>
                `;
            });
        }

        function apriModaleRuolo() {
            document.getElementById('form-ruolo').reset();
            document.getElementById('ruolo-id').value = '';
            document.getElementById('modale-ruolo-titolo').textContent = "Aggiungi Ruolo";
            document.getElementById('modale-ruolo').style.display = 'flex';
        }

        function chiudiModaleRuolo() {
            document.getElementById('modale-ruolo').style.display = 'none';
        }

        function modificaRuolo(id) {
            const authData = window.FranklinApp.Storage.ottieniAuth();
            const ruolo = (authData.ruoli || []).find(r => r.id === id);
            
            if (!ruolo) return;

            document.getElementById('form-ruolo').reset();
            document.getElementById('ruolo-id').value = ruolo.id;
            document.getElementById('ruolo-nome').value = ruolo.nome;
            
            const checkboxes = document.querySelectorAll('input[name="ruolo-permessi"]');
            checkboxes.forEach(cb => {
                cb.checked = (ruolo.permessi || []).includes(cb.value);
            });

            document.getElementById('modale-ruolo-titolo').textContent = "Modifica Ruolo";
            document.getElementById('modale-ruolo').style.display = 'flex';
        }

        function salvaRuolo() {
            const id = document.getElementById('ruolo-id').value;
            const nome = document.getElementById('ruolo-nome').value;
            
            const checkboxes = document.querySelectorAll('input[name="ruolo-permessi"]:checked');
            const permessi = Array.from(checkboxes).map(cb => cb.value);
            
            const authData = window.FranklinApp.Storage.ottieniAuth();
            if (!authData.ruoli) authData.ruoli = [];

            if (id) {
                // Modifica
                const index = authData.ruoli.findIndex(r => r.id === id);
                if (index !== -1) {
                    authData.ruoli[index].nome = nome;
                    
                    // L'admin di base ha sempre permessi su users e non lo togliamo
                    if (authData.ruoli[index].id === 'ruolo_admin' && !permessi.includes('users')) {
                        permessi.push('users');
                    }
                    authData.ruoli[index].permessi = permessi;
                }
            } else {
                // Nuovo
                authData.ruoli.push({
                    id: 'role_' + Date.now(),
                    nome: nome,
                    permessi: permessi
                });
            }

            window.FranklinApp.Storage.salvaAuth(authData);
            chiudiModaleRuolo();
            caricaRuoli();
            popolaSelectRuoli();
            caricaUtenti(); // I nomi dei ruoli in tabella utenti potrebbero essere aggiornati
            mostraToast("Ruolo salvato con successo", "successo");
        }

        function eliminaRuolo(id) {
            if (!confirm("Sei sicuro di voler eliminare questo ruolo? Gli utenti con questo ruolo perderanno l'accesso.")) return;
            
            const authData = window.FranklinApp.Storage.ottieniAuth();
            if (authData.ruoli) {
                authData.ruoli = authData.ruoli.filter(r => r.id !== id);
                window.FranklinApp.Storage.salvaAuth(authData);
                caricaRuoli();
                popolaSelectRuoli();
                caricaUtenti();
                mostraToast("Ruolo eliminato", "successo");
            }
        }

        // --- UTILITY ---
        function mostraToast(messaggio, tipo = "info") {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = "bg-wood-400";
            let icona = "ℹ️";
            
            if (tipo === "successo") { bgClass = "bg-green-200"; icona = "✅"; }
            else if (tipo === "errore") { bgClass = "bg-danger"; icona = "❌"; }
            else if (tipo === "attenzione") { bgClass = "bg-wood-200"; icona = "⚠️"; }
            
            toast.className = `toast-notification ${bgClass}`;
            toast.style.padding = "12px 20px";
            toast.style.borderRadius = "var(--border-radius-md)";
            toast.style.color = "var(--color-text-cream)";
            toast.style.fontFamily = "var(--font-body)";
            toast.style.fontSize = "0.95rem";
            toast.style.display = "flex";
            toast.style.alignItems = "center";
            toast.style.gap = "10px";
            toast.style.boxShadow = "var(--shadow-md)";
            toast.style.borderLeft = "4px solid var(--color-brass-base)";
            toast.style.opacity = "0";
            toast.style.transform = "translateX(100%)";
            toast.style.transition = "all 0.3s cubic-bezier(0.68, -0.55, 0.27, 1.55)";
            
            toast.innerHTML = `<span>${icona}</span> <span>${messaggio}</span>`;
            container.appendChild(toast);
            
            setTimeout(() => { toast.style.opacity = "1"; toast.style.transform = "translateX(0)"; }, 10);
            
            setTimeout(() => {
                toast.style.opacity = "0";
                toast.style.transform = "translateX(100%)";
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }
    </script>
</body>
</html>
