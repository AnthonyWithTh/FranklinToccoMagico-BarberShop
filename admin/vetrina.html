<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vetrina - Franklin Admin</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@400;500;600;700&family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/vintage-theme.css">
    <link rel="stylesheet" href="../css/admin.css">
    <!-- Blocco anti-fouc e Auth -->
    <style id="anti-fouc">html { display: none !important; }</style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        if (window.FranklinApp && window.FranklinApp.Auth) {
            if (!window.FranklinApp.Auth.isAutenticato()) {
                window.location.href = 'login.html';
            } else {
                window.FranklinApp.Auth.verificaAccesso();
            }
        }
    </script>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <script src="../js/components/sidebar.js"></script>

        <!-- Main Content -->
        <main class="main-content" style="padding: 2rem; overflow-y: auto;">
            <div class="admin-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 class="vintage-title" style="font-size: 2rem; color: var(--color-text-cream); margin-bottom: 0.2rem;">Gestione Vetrina</h1>
                </div>
            </div>
            
            <div style="display: flex; flex-direction: column; gap: 2rem;">
                
                <!-- Section 1: Barra di navigazione -->
                <div class="vintage-card admin-form">
                    <h3 class="vintage-title" style="color: var(--color-brass-base); margin-bottom: 1rem;">Barra di navigazione ??</h3>
                    <form id="form-header" onsubmit="event.preventDefault();">
                        <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Titolo Logo</label>
                                <input type="text" id="logo-titolo" class="vintage-input" style="width: 100%;" onchange="salvaVetrina()">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Sottotitolo Logo</label>
                                <input type="text" id="logo-sottotitolo" class="vintage-input" style="width: 100%;" onchange="salvaVetrina()">
                            </div>
                        </div>
                    </form>
                </div>

                <!-- Section 2: Sezione Introduttiva -->
                <div class="vintage-card admin-form">
                    <h3 class="vintage-title" style="color: var(--color-brass-base); margin-bottom: 1rem;">Sezione Introduttiva ???</h3>
                    
                    <div style="margin-bottom: 1.5rem; padding-bottom: 1.5rem; border-bottom: 1px solid var(--color-brass-dark);">
                        <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Immagine di Sfondo</label>
                        <div style="display: flex; gap: 1rem; align-items: center;">
                            <img id="anteprima-hero" src="../assets/images/hero-bg.jpg" alt="Hero" style="width: 160px; height: 90px; object-fit: cover; border: 2px solid var(--color-brass-base); border-radius: var(--border-radius-sm);">
                            <div>
                                <input type="file" id="hero-image-upload" style="display: none;" accept="image/jpeg, image/png, image/webp" onchange="gestisciUploadImmagineUnica(this)">
                                <button class="btn-primary" onclick="document.getElementById('hero-image-upload').click()">Cambia Immagine</button>
                                <div id="upload-status" style="color: var(--color-brass-base); font-size: 0.85rem; margin-top: 0.5rem;"></div>
                            </div>
                        </div>
                        <input type="hidden" id="hero-immagine" onchange="salvaVetrina()">
                    </div>

                    <form id="form-hero" onsubmit="event.preventDefault();">
                        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Titolo Principale</label>
                                <input type="text" id="hero-titolo" class="vintage-input" style="width: 100%;" onchange="salvaVetrina()">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Sottotitolo</label>
                                <input type="text" id="hero-sottotitolo" class="vintage-input" style="width: 100%;" onchange="salvaVetrina()">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Tipo Attività</label>
                                <input type="text" id="hero-sottotitoletto" class="vintage-input" style="width: 100%;" onchange="salvaVetrina()">
                            </div>
                        </div>
                        <div class="form-group" style="margin-bottom: 1rem;">
                            <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Sottotitolo Promozionale</label>
                            <input type="text" id="hero-promo" class="vintage-input" style="width: 100%;" onchange="salvaVetrina()">
                        </div>
                        <div class="form-group" style="margin-bottom: 1.5rem;">
                            <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Testo Descrittivo</label>
                            <textarea id="hero-descrizione" class="vintage-textarea" rows="3" style="width: 100%;" onchange="salvaVetrina()"></textarea>
                        </div>
                    </form>
                </div>

                <!-- Section 3: Contatti & Social -->
                <div class="vintage-card admin-form">
                    <h3 class="vintage-title" style="color: var(--color-brass-base); margin-bottom: 1rem;">Contatti & Social ??</h3>
                    <form id="form-contatti" onsubmit="event.preventDefault();">
                        
                        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                            <div class="form-group" style="flex: 2;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Via/Piazza</label>
                                <input type="text" id="info-via" class="vintage-input" style="width: 100%;" onchange="salvaVetrina()">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Numero</label>
                                <input type="text" id="info-numero" class="vintage-input" style="width: 100%;" onchange="salvaVetrina()">
                            </div>
                        </div>
                        
                        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">CAP</label>
                                <input type="text" id="info-cap" class="vintage-input" style="width: 100%;" onchange="salvaVetrina()">
                            </div>
                            <div class="form-group" style="flex: 2;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Città</label>
                                <input type="text" id="info-citta" class="vintage-input" style="width: 100%;" onchange="salvaVetrina()">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Provincia</label>
                                <input type="text" id="info-provincia" class="vintage-input" style="width: 100%; text-transform: uppercase;" maxlength="2" onchange="salvaVetrina()">
                            </div>
                        </div>

                        <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Telefono</label>
                                <input type="text" id="info-telefono" class="vintage-input" style="width: 100%;" onchange="salvaVetrina()">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Email</label>
                                <input type="email" id="info-email" class="vintage-input" style="width: 100%;" onchange="salvaVetrina()">
                            </div>
                        </div>
                        <div style="display: flex; gap: 1rem; margin-bottom: 1.5rem;">
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Link Instagram</label>
                                <input type="text" id="social-instagram" class="vintage-input" style="width: 100%;" onchange="salvaVetrina()">
                            </div>
                            <div class="form-group" style="flex: 1;">
                                <label style="font-family: var(--font-admin); color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Link Facebook</label>
                                <input type="text" id="social-facebook" class="vintage-input" style="width: 100%;" onchange="salvaVetrina()">
                            </div>
                        </div>
                    </form>
                </div>
                
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="../js/mock-data.js"></script>
    <script src="../js/public.js"></script>
    <script src="../js/admin.js"></script>
    
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (window.FranklinApp && window.FranklinApp.Auth && !window.FranklinApp.Auth.isAutenticato()) {
                window.location.href = 'login.html';
                return;
            }
            caricaVetrina();
        });

        async function caricaVetrina() {
            if (window.FranklinApp && window.FranklinApp.Storage) {
                const imp = await window.FranklinApp.Storage.ottieniImpostazioni();
                if (imp) {
                    document.getElementById('logo-titolo').value = imp.logo_titolo || '';
                    document.getElementById('logo-sottotitolo').value = imp.logo_sottotitolo || '';
                    document.getElementById('hero-titolo').value = imp.hero_titolo || '';
                    document.getElementById('hero-sottotitolo').value = imp.hero_sottotitolo || '';
                    document.getElementById('hero-sottotitoletto').value = imp.hero_sottotitoletto || '';
                    document.getElementById('hero-promo').value = imp.hero_promo || '';
                    document.getElementById('hero-descrizione').value = imp.hero_descrizione || '';
                    
                    document.getElementById('info-via').value = imp.info_via || '';
                    document.getElementById('info-numero').value = imp.info_numero || '';
                    document.getElementById('info-cap').value = imp.info_cap || '';
                    document.getElementById('info-citta').value = imp.info_citta || '';
                    document.getElementById('info-provincia').value = imp.info_provincia || '';
                    
                    document.getElementById('info-telefono').value = imp.info_telefono || '';
                    document.getElementById('info-email').value = imp.info_email || '';
                    document.getElementById('social-instagram').value = imp.social_instagram || '';
                    document.getElementById('social-facebook').value = imp.social_facebook || '';
                    
                    const heroImgInput = document.getElementById('hero-immagine');
                    const heroPreview = document.getElementById('anteprima-hero');
                    if (imp.hero_immagine) {
                        heroImgInput.value = imp.hero_immagine;
                        heroPreview.src = imp.hero_immagine;
                    }
                }
            }
        }

        async function salvaVetrina() {
            const data = {
                logo_titolo: document.getElementById('logo-titolo').value,
                logo_sottotitolo: document.getElementById('logo-sottotitolo').value,
                hero_titolo: document.getElementById('hero-titolo').value,
                hero_sottotitolo: document.getElementById('hero-sottotitolo').value,
                hero_sottotitoletto: document.getElementById('hero-sottotitoletto').value,
                hero_promo: document.getElementById('hero-promo').value,
                hero_descrizione: document.getElementById('hero-descrizione').value,
                
                info_via: document.getElementById('info-via').value,
                info_numero: document.getElementById('info-numero').value,
                info_cap: document.getElementById('info-cap').value,
                info_citta: document.getElementById('info-citta').value,
                info_provincia: document.getElementById('info-provincia').value.toUpperCase(),
                
                info_telefono: document.getElementById('info-telefono').value,
                info_email: document.getElementById('info-email').value,
                social_instagram: document.getElementById('social-instagram').value,
                social_facebook: document.getElementById('social-facebook').value,
                
                hero_immagine: document.getElementById('hero-immagine').value
            };
            
            if (window.FranklinApp && window.FranklinApp.Storage) {
                // Autosave silezioso, senza toast per evitare spam.
                await window.FranklinApp.Storage.salvaVetrina(data);
            }
        }

        async function gestisciUploadImmagineUnica(input) {
            const status = document.getElementById('upload-status');
            if (input.files && input.files[0]) {
                status.textContent = 'Caricamento in corso...';
                if (window.FranklinApp && window.FranklinApp.Storage) {
                    const url = await window.FranklinApp.Storage.uploadImmagine(input.files[0], 'immagini_vetrina');
                    if (url) {
                        status.textContent = 'Salvato!';
                        document.getElementById('hero-immagine').value = url;
                        document.getElementById('anteprima-hero').src = url;
                        salvaVetrina();
                        setTimeout(() => { status.textContent = ''; }, 3000);
                    } else {
                        status.textContent = 'Errore durante il caricamento.';
                    }
                }
            }
            input.value = '';
        }
    </script>
</body>
</html>
