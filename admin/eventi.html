<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eventi - Franklin Admin</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@400;500;600;700&family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/vintage-theme.css">
    <link rel="stylesheet" href="../css/admin.css">
    
    <style id="anti-fouc">html { display: none !important; }</style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        if (window.FranklinApp && window.FranklinApp.Auth) {
            if (!window.FranklinApp.Auth.isAutenticato()) {
                window.location.href = 'login.html';
            } else {
                window.FranklinApp.Auth.verificaAccesso();
            }
        }
    </script>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <script src="../js/components/sidebar.js"></script>

        <!-- Main Content -->
        <main class="main-content" style="padding: 2rem; overflow-y: auto;">
            <div class="admin-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 class="vintage-title" style="font-size: 2rem; color: var(--color-text-cream); margin-bottom: 0.2rem;">Eventi Promozionali</h1>
                    <p style="font-family: var(--font-admin); color: var(--color-brass-light);">Gestione eventi attivi e programmati nel tempo.</p>
                </div>
                <button class="btn-primary" onclick="apriModaleEvento()" style="font-size: 1rem; padding: 0.8rem 1.5rem;">+ Aggiungi evento</button>
            </div>

            <!-- Tabella Eventi Attivi -->
            <div class="vintage-card" style="margin-bottom: 2rem;">
                <h2 style="font-family: var(--font-vintage); color: var(--color-green-100); margin-bottom: 1rem;">Eventi Attivi</h2>
                <div class="admin-tabella-container">
                    <table class="admin-tabella">
                        <thead>
                            <tr>
                                <th>Titolo</th>
                                <th>Descrizione</th>
                                <th>Data Inizio</th>
                                <th>Data Fine</th>
                                <th>Stato</th>
                                <th>Azioni</th>
                            </tr>
                        </thead>
                        <tbody id="attivi-tbody">
                            <!-- Popolato via JS -->
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Tabella Eventi Passati -->
            <div class="vintage-card">
                <h2 style="font-family: var(--font-vintage); color: var(--color-text-muted); margin-bottom: 1rem;">Eventi Passati / Disattivati</h2>
                <div class="admin-tabella-container">
                    <table class="admin-tabella">
                        <thead>
                            <tr>
                                <th>Titolo</th>
                                <th>Descrizione</th>
                                <th>Data Inizio</th>
                                <th>Data Fine</th>
                                <th>Stato</th>
                                <th>Azioni</th>
                            </tr>
                        </thead>
                        <tbody id="passati-tbody">
                            <!-- Popolato via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modale Evento -->
    <div id="modal-evento" class="modal-overlay" style="display: none; z-index: 1000;">
        <div class="modal-content vintage-card" style="max-width: 500px;">
            <h2 id="modal-titolo" class="vintage-title" style="font-size: 1.5rem; color: var(--color-brass-base); margin-bottom: 1.5rem; text-align: center;">Nuovo Evento</h2>
            
            <form id="form-evento" onsubmit="salvaEvento(event)">
                <input type="hidden" id="evento-id">
                
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Titolo Evento</label>
                    <input type="text" id="evento-titolo" class="vintage-input" style="width: 100%;" required>
                </div>
                
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Descrizione (breve)</label>
                    <textarea id="evento-descrizione" class="vintage-textarea" style="width: 100%; height: 80px;" required></textarea>
                </div>
                
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group" style="flex: 1;">
                        <label style="color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Data Inizio</label>
                        <input type="date" id="evento-inizio" class="vintage-input" style="width: 100%;" required>
                    </div>
                    <div class="form-group" style="flex: 1;">
                        <label style="color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Data Fine</label>
                        <input type="date" id="evento-fine" class="vintage-input" style="width: 100%;" required>
                    </div>
                </div>

                <div class="form-group" style="margin-bottom: 2rem;">
                    <label style="color: var(--color-text-cream); display: flex; align-items: center; gap: 0.5rem; cursor: pointer;">
                        <input type="checkbox" id="evento-attivo" checked>
                        Evento attivo e visibile (entro le date stabilite)
                    </label>
                </div>
                
                <div style="display: flex; gap: 1rem; justify-content: flex-end;">
                    <button type="button" class="btn-secondary" onclick="chiudiModaleEvento()" style="padding: 0.6rem 1.2rem;">Annulla</button>
                    <button type="submit" class="btn-primary" style="padding: 0.6rem 1.2rem;">Salva Evento</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Contenitore Toast -->
    <div id="toast-container" style="position: fixed; bottom: 20px; right: 20px; z-index: 9999;"></div>

    <script src="../js/public.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        let tuttiEventi = [];

        document.addEventListener('DOMContentLoaded', () => {
            caricaEventi();
        });

        async function caricaEventi() {
            if(!window.FranklinApp || !window.FranklinApp.Storage) return;
            
            tuttiEventi = await window.FranklinApp.Storage.ottieniEventi();
            renderTabelle();
        }

        function isEventoAttivo(evento) {
            if(!evento.attivo) return false;
            
            const oggi = new Date().toISOString().split('T')[0];
            return (oggi >= evento.data_inizio && oggi <= evento.data_fine);
        }

        function isEventoFuturo(evento) {
             if(!evento.attivo) return false;
             const oggi = new Date().toISOString().split('T')[0];
             return (oggi < evento.data_inizio);
        }

        function renderTabelle() {
            const tbodyAttivi = document.getElementById('attivi-tbody');
            const tbodyPassati = document.getElementById('passati-tbody');
            
            tbodyAttivi.innerHTML = '';
            tbodyPassati.innerHTML = '';
            
            let countAttivi = 0, countPassati = 0;

            tuttiEventi.forEach(e => {
                const attivo = isEventoAttivo(e);
                const futuro = isEventoFuturo(e);
                const isActiveTab = (attivo || futuro) && e.attivo;
                
                let badgeClass = 'badge';
                let statoStr = 'Programmato';
                
                if(attivo) {
                    badgeClass = 'badge-confirmed';
                    statoStr = 'In Corso';
                } else if(!e.attivo) {
                    badgeClass = 'badge-cancelled';
                    statoStr = 'Disattivato manualm.';
                } else {
                    badgeClass = 'badge';
                    statoStr = 'Terminato';
                }

                const riga = `
                    <tr>
                        <td style="font-weight: bold; color: var(--color-brass-light);">${e.titolo}</td>
                        <td style="max-width: 250px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${e.descrizione}">${e.descrizione}</td>
                        <td style="font-family: var(--font-typewriter);">${e.data_inizio}</td>
                        <td style="font-family: var(--font-typewriter);">${e.data_fine}</td>
                        <td><span class="${badgeClass}">${statoStr}</span></td>
                        <td>
                            <div style="display: flex; gap: 0.5rem;">
                                <button class="btn-primary" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; min-width: auto;" onclick="modificaEvento('${e.id}')">Modifica</button>
                                <button class="btn-danger" style="padding: 0.3rem 0.6rem; font-size: 0.8rem; min-width: auto;" onclick="eliminaEvento('${e.id}')">Elimina</button>
                            </div>
                        </td>
                    </tr>
                `;

                if(isActiveTab) {
                    tbodyAttivi.innerHTML += riga;
                    countAttivi++;
                } else {
                    tbodyPassati.innerHTML += riga;
                    countPassati++;
                }
            });

            if(countAttivi === 0) tbodyAttivi.innerHTML = '<tr><td colspan="6" style="text-align: center;">Nessun evento attivo o programmato.</td></tr>';
            if(countPassati === 0) tbodyPassati.innerHTML = '<tr><td colspan="6" style="text-align: center;">Nessun evento passato.</td></tr>';
        }

        function apriModaleEvento(id = null) {
            document.getElementById('form-evento').reset();
            document.getElementById('evento-id').value = '';
            document.getElementById('modal-titolo').textContent = 'Nuovo Evento';
            
            if(id) {
                const e = tuttiEventi.find(x => x.id === id);
                if(e) {
                    document.getElementById('modal-titolo').textContent = 'Modifica Evento';
                    document.getElementById('evento-id').value = e.id;
                    document.getElementById('evento-titolo').value = e.titolo;
                    document.getElementById('evento-descrizione').value = e.descrizione;
                    document.getElementById('evento-inizio').value = e.data_inizio;
                    document.getElementById('evento-fine').value = e.data_fine;
                    document.getElementById('evento-attivo').checked = e.attivo;
                }
            }
            
            document.getElementById('modal-evento').style.display = 'flex';
        }

        function chiudiModaleEvento() {
            document.getElementById('modal-evento').style.display = 'none';
        }

        function modificaEvento(id) {
            apriModaleEvento(id);
        }

        async function salvaEvento(ev) {
            ev.preventDefault();
            
            const id = document.getElementById('evento-id').value;
            const inizio = document.getElementById('evento-inizio').value;
            const fine = document.getElementById('evento-fine').value;
            
            if (inizio > fine) {
                FranklinApp.Admin.mostraToast("Errore: la data di fine precede l'inizio.", 'error');
                return;
            }

            const dati = {
                titolo: document.getElementById('evento-titolo').value,
                descrizione: document.getElementById('evento-descrizione').value,
                data_inizio: inizio,
                data_fine: fine,
                attivo: document.getElementById('evento-attivo').checked
            };

            const btn = ev.target.querySelector('button[type="submit"]');
            btn.disabled = true;
            btn.textContent = 'Salvataggio...';

            let result;
            if (id) {
                result = await window.FranklinApp.Storage.aggiornaEvento(id, dati);
            } else {
                result = await window.FranklinApp.Storage.aggiungiEvento(dati);
            }

            btn.disabled = false;
            btn.textContent = 'Salva Evento';

            if(result) {
                FranklinApp.Admin.mostraToast('Evento salvato con successo!', 'success');
                chiudiModaleEvento();
                caricaEventi();
            } else {
                FranklinApp.Admin.mostraToast('Errore durante il salvataggio.', 'error');
            }
        }

        async function eliminaEvento(id) {
            if(!confirm("Sei sicuro di voler eliminare questo evento?")) return;
            
            const result = await window.FranklinApp.Storage.eliminaEvento(id);
            if(result) {
                FranklinApp.Admin.mostraToast('Evento eliminato.', 'success');
                caricaEventi();
            } else {
                FranklinApp.Admin.mostraToast("Errore durante l'eliminazione.", 'error');
            }
        }
    </script>
</body>
</html>
