<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Storico - Franklin Admin</title>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Abril+Fatface&family=Lora:ital,wght@0,400..700;1,400..700&family=Montserrat:wght@400;500;600;700&family=Rye&family=Special+Elite&display=swap" rel="stylesheet">
    
    <!-- CSS -->
    <link rel="stylesheet" href="../css/variables.css">
    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/vintage-theme.css">
    <link rel="stylesheet" href="../css/admin.css">
    <!-- Blocco anti-fouc e Auth -->
    <style id="anti-fouc">html { display: none !important; }</style>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="../js/storage.js"></script>
    <script src="../js/auth.js"></script>
    <script>
        if (window.FranklinApp && window.FranklinApp.Auth) {
            if (!window.FranklinApp.Auth.isAutenticato()) {
                window.location.href = 'login.html';
            } else {
                window.FranklinApp.Auth.verificaAccesso();
            }
        }
    </script>
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar -->
        <script src="../js/components/sidebar.js"></script>

        <!-- Main Content -->
        <main class="main-content" style="padding: 2rem; overflow-y: auto;">
            <div class="admin-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <div>
                    <h1 class="vintage-title" style="font-size: 2rem; color: var(--color-text-cream); margin-bottom: 0.2rem;">Storico Appuntamenti</h1>
                    <p style="font-family: var(--font-admin); color: var(--color-brass-light);">Consultazione degli appuntamenti passati archiviati.</p>
                </div>
            </div>

            <!-- Filtri e Statistiche -->
            <div class="vintage-card" style="margin-bottom: 2rem;">
                <div style="display: flex; justify-content: space-between; flex-wrap: wrap; gap: 1rem;">
                    <!-- Filtri (Sinistra) -->
                    <div style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
                        <div class="form-group" style="margin: 0;">
                            <label style="color: var(--color-text-cream); display: block; margin-bottom: 0.3rem;">Data</label>
                            <input type="date" id="filtro-data" class="vintage-input" style="padding: 0.3rem 0.6rem;" onchange="aggiornaStorico()">
                        </div>
                        <div class="form-group" style="margin: 0;">
                            <label style="color: var(--color-text-cream); display: block; margin-bottom: 0.3rem;">Barbiere</label>
                            <select id="filtro-barbiere" class="vintage-select" style="padding: 0.3rem 0.6rem;" onchange="aggiornaStorico()">
                                <option value="tutti">Tutti i barbieri</option>
                                <!-- Popolato via JS -->
                            </select>
                        </div>
                        <div style="display: flex; gap: 0.5rem; flex-wrap: wrap; align-items: flex-end;">
                            <button class="btn-primary" onclick="resetFiltri()">Reset Filtri</button>
                        </div>
                    </div>

                    <!-- Statistiche come Badge (Destra) -->
                    <div style="display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap;">
                        <div class="badge" style="background: var(--color-black-100); border-color: var(--color-brass-base); color: var(--color-brass-light); padding: 0.5rem 1rem; font-size: 1rem; display: flex; align-items: center; gap: 0.5rem; height: 38px;">
                            <span style="font-family: var(--font-vintage); opacity: 0.8;">Incasso Stimato:</span> 
                            <strong style="font-family: var(--font-typewriter);">€ <span id="stat-incasso">0.00</span></strong>
                        </div>
                        <div class="badge" style="background: var(--color-black-100); border-color: var(--color-green-100); color: var(--color-green-200); padding: 0.5rem 1rem; font-size: 1rem; display: flex; align-items: center; gap: 0.5rem; height: 38px;">
                            <span style="font-family: var(--font-vintage); opacity: 0.8;">Clienti:</span> 
                            <strong style="font-family: var(--font-typewriter);"><span id="stat-clienti">0</span></strong>
                        </div>
                    </div>
                </div>
                
                <div class="brass-divider" style="margin: 1.5rem 0;"></div>

                <!-- Fisarmonica per la pulizia schedulata compressa -->
                <div style="border: 1px solid var(--color-wood-300); border-radius: var(--border-radius-sm); overflow: hidden;">
                    <button onclick="document.getElementById('accordion-pulizia').classList.toggle('hidden')" style="width: 100%; text-align: left; background: rgba(0,0,0,0.2); border: none; padding: 0.8rem 1rem; color: var(--color-text-muted); font-family: var(--font-admin); font-size: 0.9rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center;">
                        <span>⚙️ Impostazione pulizia programmata</span>
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>
                    </button>
                    <div id="accordion-pulizia" class="hidden" style="padding: 1rem; background: rgba(0,0,0,0.1); display: flex; align-items: center; gap: 1rem;">
                        <label style="color: var(--color-text-cream); font-size: 0.9rem;">Orario pulizia:</label>
                        <input type="time" id="input-ora-pulizia" class="vintage-input" style="padding: 0.3rem 0.6rem; width: 120px;" value="22:00">
                        <button class="btn-primary" onclick="salvaImpostazionePulizia()" style="padding: 0.3rem 1rem;">Salva</button>
                    </div>
                </div>
            </div>
            
            <!-- Grafico -->
            <div class="vintage-card" style="margin-bottom: 2rem;">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; flex-wrap: wrap; gap: 1rem;">
                    <h3 style="font-family: var(--font-vintage); color: var(--color-text-muted); margin: 0;">Andamento Incassi</h3>
                    <select id="filtro-periodo-grafico" class="vintage-select" style="padding: 0.3rem 0.6rem; min-width: 120px;" onchange="aggiornaStorico()">
                        <option value="7">Ultimi 7 giorni</option>
                        <option value="30">Ultimo mese</option>
                        <option value="90">Ultimi 3 mesi</option>
                        <option value="180">Ultimi 6 mesi</option>
                        <option value="365">Ultimo anno</option>
                    </select>
                </div>
                <canvas id="storicoChart" style="max-height: 300px;"></canvas>
            </div>
            
            <!-- Badges filtri attivi Tabella -->
            <div id="badges-filtri" style="display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1rem;"></div>

            <!-- Tabella Storico -->
            <div class="vintage-card">
                <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h3 style="font-family: var(--font-vintage); color: var(--color-green-100); margin: 0;">Appuntamenti Storico</h3>
                    <button class="btn-primary" onclick="apriModaleStorico()" style="padding: 0.4rem 0.9rem; font-size: 1.2rem; font-weight: bold; line-height: 1;" title="Aggiungi Appuntamento">+</button>
                </div>
                <div class="admin-tabella-container">
                    <table class="admin-tabella">
                        <thead>
                            <tr>
                                <th>Data</th>
                                <th>Ora</th>
                                <th>Cliente</th>
                                <th>Telefono</th>
                                <th>Barbiere</th>
                                <th>Servizio</th>
                                <th>Costo</th>
                                <th>Stato</th>
                                <th>Note</th>
                                <th>Azioni</th>
                            </tr>
                        </thead>
                        <tbody id="storico-tbody">
                            <!-- Popolato via JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <!-- Modale per aggiunta/modifica Storico -->
    <div id="modal-storico" class="modal-overlay" style="display: none; z-index: 1000;">
        <div class="modal-content vintage-card" style="max-width: 500px;">
            <h2 id="modal-storico-titolo" class="vintage-title" style="font-size: 1.5rem; color: var(--color-brass-base); margin-bottom: 1.5rem; text-align: center;">Aggiungi allo Storico</h2>
            
            <form id="form-storico" onsubmit="salvaRecordStorico(event)">
                <input type="hidden" id="storico-id">
                
                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group" style="flex: 1; margin: 0;">
                        <label style="color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Data</label>
                        <input type="date" id="storico-data" class="vintage-input" style="width: 100%;" required>
                    </div>
                    <div class="form-group" style="flex: 1; margin: 0;">
                        <label style="color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Ora</label>
                        <input type="time" id="storico-ora" class="vintage-input" style="width: 100%;" required>
                    </div>
                </div>
                
                <div class="form-group" style="margin-bottom: 1rem;">
                    <label style="color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Cliente (Nome)</label>
                    <input type="text" id="storico-cliente" class="vintage-input" style="width: 100%;" required>
                </div>

                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group" style="flex: 1; margin: 0;">
                        <label style="color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Barbiere</label>
                        <select id="storico-barbiere" class="vintage-select" style="width: 100%;" required>
                            <option value="">-- Seleziona --</option>
                        </select>
                    </div>
                    <div class="form-group" style="flex: 1; margin: 0;">
                        <label style="color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Servizio</label>
                        <select id="storico-servizio" class="vintage-select" style="width: 100%;" required onchange="aggiornaCostoStorico()">
                            <option value="">-- Seleziona --</option>
                        </select>
                    </div>
                </div>

                <div style="display: flex; gap: 1rem; margin-bottom: 1rem;">
                    <div class="form-group" style="flex: 1; margin: 0;">
                        <label style="color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Costo (€)</label>
                        <input type="number" id="storico-costo" class="vintage-input" style="width: 100%;" step="0.01" min="0" required>
                    </div>
                    <div class="form-group" style="flex: 1; margin: 0;">
                        <label style="color: var(--color-text-cream); display: block; margin-bottom: 0.5rem;">Stato</label>
                        <select id="storico-stato" class="vintage-select" style="width: 100%;" required>
                            <option value="Completato">Completato</option>
                            <option value="Non Confermato">Non Confermato</option>
                        </select>
                    </div>
                </div>
                
                <div style="display: flex; justify-content: flex-end; gap: 1rem; margin-top: 1.5rem;">
                    <button type="button" class="btn-secondary" onclick="document.getElementById('modal-storico').style.display = 'none';">Annulla</button>
                    <button type="submit" class="btn-primary">Salva</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Scripts -->
    <script src="../js/mock-data.js"></script>
    <script src="../js/public.js"></script>
    <script src="../js/admin.js"></script>
    <script>
        let tuttiServizi = [];

        document.addEventListener('DOMContentLoaded', async () => {
            if (window.FranklinApp && window.FranklinApp.Auth) {
                if (!window.FranklinApp.Auth.isAutenticato()) {
                    window.location.href = 'login.html';
                    return;
                }
                window.FranklinApp.Auth.caricaMenuSidebar();
            }

            // Imposta data di default a ieri
            const ieri = new Date();
            ieri.setDate(ieri.getDate() - 1);
            document.getElementById('filtro-data').value = ieri.toISOString().split('T')[0];
            
            await caricaFiltroBarbieri();
            await caricaServiziPerModale();
            aggiornaStorico();
        });

        async function caricaFiltroBarbieri() {
            if(window.FranklinApp && window.FranklinApp.Storage) {
                const barbieri = await window.FranklinApp.Storage.ottieniBarbieri();
                const sel = document.getElementById('filtro-barbiere');
                const modalSel = document.getElementById('storico-barbiere');
                if(barbieri) {
                    barbieri.forEach(b => {
                        if(b.attivo !== false) {
                            if (sel) sel.innerHTML += `<option value="${b.id}">${b.nome} ${b.cognome}</option>`;
                            if (modalSel) modalSel.innerHTML += `<option value="${b.nome} ${b.cognome}">${b.nome} ${b.cognome}</option>`;
                        }
                    });
                }
            }
        }

        async function caricaServiziPerModale() {
            if(window.FranklinApp && window.FranklinApp.Storage) {
                tuttiServizi = await window.FranklinApp.Storage.ottieniServizi() || [];
                const modalSel = document.getElementById('storico-servizio');
                if (modalSel) {
                    tuttiServizi.forEach(s => {
                        if (s.attivo !== false) {
                            modalSel.innerHTML += `<option value="${s.nome}" data-prezzo="${s.prezzo}">${s.nome} - €${parseFloat(s.prezzo).toFixed(2)}</option>`;
                        }
                    });
                }
            }
        }

        function aggiornaCostoStorico() {
            const sel = document.getElementById('storico-servizio');
            const opt = sel.options[sel.selectedIndex];
            if (opt && opt.dataset.prezzo) {
                document.getElementById('storico-costo').value = opt.dataset.prezzo;
            }
        }

        async function salvaImpostazionePulizia() {
            const ora = document.getElementById('input-ora-pulizia').value;
            if (!ora) return;
            // window.FranklinApp.Storage.salvaOraPulizia(ora);
            if (window.FranklinApp.Admin && window.FranklinApp.Admin.mostraToast) {
                window.FranklinApp.Admin.mostraToast("Orario pulizia salvato con successo!", "successo");
            } else {
                alert("Orario pulizia salvato: " + ora);
            }
        }

        function resetFiltri() {
            document.getElementById('filtro-data').value = '';
            document.getElementById('filtro-barbiere').value = 'tutti';
            aggiornaStorico();
        }

        let storicoChartInstance = null;

        async function aggiornaStorico() {
            if(!window.FranklinApp || !window.FranklinApp.Storage) return;

            const dateInput = document.getElementById('filtro-data');
            const barbiereInput = document.getElementById('filtro-barbiere');
            
            const dateStr = dateInput.value || 'tutte';
            const bId = barbiereInput.value;
            
            const tbody = document.getElementById('storico-tbody');
            tbody.innerHTML = '<tr><td colspan="9" style="text-align: center;">Caricamento in corso...</td></tr>';

            // Carica Dati
            const appuntamenti = await window.FranklinApp.Storage.ottieniStoricoAppuntamenti(dateStr, bId);
            const stats = await window.FranklinApp.Storage.ottieniStatisticheStorico(dateStr, bId);

            // Aggiorna Badges Filtri
            const badgesContainer = document.getElementById('badges-filtri');
            badgesContainer.innerHTML = '';
            if (dateStr !== 'tutte') {
                const dateObj = new Date(dateStr);
                const dataFormat = dateObj.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });
                badgesContainer.innerHTML += `<span class="badge" style="background: var(--color-wood-300); color: var(--color-text-cream);">Data: ${dataFormat} <button onclick="document.getElementById('filtro-data').value=''; aggiornaStorico();" style="background:none; border:none; color:inherit; cursor:pointer; margin-left:5px;">&times;</button></span>`;
            }
            if (bId !== 'tutti') {
                const barbiereNome = barbiereInput.options[barbiereInput.selectedIndex].text;
                badgesContainer.innerHTML += `<span class="badge" style="background: var(--color-wood-300); color: var(--color-text-cream);">Barbiere: ${barbiereNome} <button onclick="document.getElementById('filtro-barbiere').value='tutti'; aggiornaStorico();" style="background:none; border:none; color:inherit; cursor:pointer; margin-left:5px;">&times;</button></span>`;
            }
            if (!tbody) return;

            tbody.innerHTML = '';

            let totaleIncasso = 0;
            let totaleClienti = 0;

            if (appuntamenti.length === 0) {
                tbody.innerHTML = '<tr><td colspan="10" style="text-align: center;">Nessun record trovato.</td></tr>';
            }

            appuntamenti.forEach(app => {
                if (app.stato === 'Completato') {
                    totaleIncasso += parseFloat(app.servizioCosto) || 0;
                    totaleClienti++;
                }

                let badgeClass = 'badge-completed';
                if (app.stato === 'Cancellato' || app.stato === 'Non Presentato') badgeClass = 'badge-cancelled';

                const dataObj = new Date(app.data);
                const dataFormat = dataObj.toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' });

                tbody.innerHTML += `
                    <tr>
                        <td style="font-family: var(--font-admin);">${dataFormat}</td>
                        <td style="font-family: var(--font-typewriter);">${app.ora}</td>
                        <td style="font-weight: bold; color: var(--color-brass-light);">${app.clienteNome}</td>
                        <td style="font-family: var(--font-typewriter);">${app.clienteTelefono || '-'}</td>
                        <td>${app.barbiereNome}</td>
                        <td>${app.servizioNome}</td>
                        <td style="font-family: var(--font-typewriter);">€ ${parseFloat(app.servizioCosto).toFixed(2)}</td>
                        <td><span class="${badgeClass}">${app.stato}</span></td>
                        <td style="max-width: 200px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;" title="${app.note || ''}">${app.note || '-'}</td>
                        <td style="white-space: nowrap;">
                            <button class="azioni-btn" title="Modifica" onclick="apriModaleStorico('${app.id}')">✏️</button>
                            <button class="azioni-btn" title="Elimina" style="color: var(--color-danger);" onclick="eliminaRecordStorico('${app.id}')">🗑️</button>
                        </td>
                    </tr>
                `;
            });

            const statIncasso = document.getElementById('stat-incasso');
            const statClienti = document.getElementById('stat-clienti');
            if (statIncasso) statIncasso.textContent = totaleIncasso.toFixed(2);
            if (statClienti) statClienti.textContent = totaleClienti;

            aggiornaGrafico(bId);
        }

        function apriModaleStorico(id = null) {
            document.getElementById('form-storico').reset();
            document.getElementById('storico-id').value = '';
            document.getElementById('modal-storico-titolo').textContent = 'Aggiungi allo Storico';
            
            if (id && typeof id === 'string') {
                const rec = datiStoricoCorrenti.find(x => x.id === id);
                if(rec) {
                    document.getElementById('modal-storico-titolo').textContent = 'Modifica Storico';
                    document.getElementById('storico-id').value = rec.id;
                    document.getElementById('storico-data').value = rec.data;
                    document.getElementById('storico-ora').value = rec.ora;
                    document.getElementById('storico-cliente').value = rec.clienteNome;
                    document.getElementById('storico-barbiere').value = rec.barbiereNome;
                    document.getElementById('storico-servizio').value = rec.servizioNome;
                    document.getElementById('storico-costo').value = rec.servizioCosto;
                    document.getElementById('storico-stato').value = rec.stato;
                }
            }
            
            document.getElementById('modal-storico').style.display = 'flex';
        }

        async function salvaRecordStorico(ev) {
            ev.preventDefault();
            const id = document.getElementById('storico-id').value;
            
            const dati = {
                data: document.getElementById('storico-data').value,
                ora: document.getElementById('storico-ora').value,
                cliente_nome: document.getElementById('storico-cliente').value,
                barbiere_nome: document.getElementById('storico-barbiere').value,
                servizio_nome: document.getElementById('storico-servizio').value,
                servizio_costo: parseFloat(document.getElementById('storico-costo').value),
                stato: document.getElementById('storico-stato').value
            };

            try {
                if (id) {
                    const { error } = await sbClient.from('appuntamenti_storico').update(dati).eq('id', id);
                    if (error) throw error;
                    if (window.FranklinApp.Admin) window.FranklinApp.Admin.mostraToast("Record aggiornato", "successo");
                } else {
                    const { error } = await sbClient.from('appuntamenti_storico').insert([dati]);
                    if (error) throw error;
                    if (window.FranklinApp.Admin) window.FranklinApp.Admin.mostraToast("Record aggiunto", "successo");
                }
                document.getElementById('modal-storico').style.display = 'none';
                aggiornaStorico();
            } catch(e) {
                console.error(e);
                if (window.FranklinApp.Admin) window.FranklinApp.Admin.mostraToast("Errore salvataggio record", "errore");
            }
        }

        async function eliminaRecordStorico(id) {
            if (!confirm("Sei sicuro di voler eliminare questo record?")) return;
            try {
                const { error } = await sbClient.from('appuntamenti_storico').delete().eq('id', id);
                if (error) throw error;
                if (window.FranklinApp.Admin) window.FranklinApp.Admin.mostraToast("Record eliminato", "successo");
                aggiornaStorico();
            } catch(e) {
                console.error(e);
                if (window.FranklinApp.Admin) window.FranklinApp.Admin.mostraToast("Errore eliminazione record", "errore");
            }
        }

        async function aggiornaGrafico(barbiereFiltro) {
            const ctx = document.getElementById('storicoChart');
            if (!ctx) return;

            const periodoSelect = document.getElementById('filtro-periodo-grafico');
            const giorniPeriodo = periodoSelect ? parseInt(periodoSelect.value) : 7;
            
            const chartData = await window.FranklinApp.Storage.ottieniStoricoGrafico(giorniPeriodo, barbiereFiltro);

            if (storicoChartInstance) {
                storicoChartInstance.destroy();
            }

            let labels = [];
            let data = [];
            let labelGrafico = 'Incasso (€)';

            if (giorniPeriodo > 31) {
                // Raggruppa per mese
                const perMese = {};
                for (let i = giorniPeriodo - 1; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const meseKey = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
                    if (!perMese[meseKey]) perMese[meseKey] = 0;
                }
                chartData.forEach(app => {
                    if (app.stato === 'Completato') {
                        const appMeseKey = app.data.substring(0, 7);
                        if (perMese[appMeseKey] !== undefined) {
                            perMese[appMeseKey] += parseFloat(app.servizio_costo) || 0;
                        }
                    }
                });
                labels = Object.keys(perMese).map(m => {
                    const d = new Date(m + '-01');
                    return d.toLocaleDateString('it-IT', { month: 'short', year: '2-digit' });
                });
                data = Object.values(perMese);
                labelGrafico = 'Incasso Mensile (€)';
            } else {
                // Raggruppa per giorno
                const ultimiGiorni = {};
                for (let i = giorniPeriodo - 1; i >= 0; i--) {
                    const d = new Date();
                    d.setDate(d.getDate() - i);
                    const isoDate = d.toISOString().split('T')[0];
                    ultimiGiorni[isoDate] = 0;
                }
                chartData.forEach(app => {
                    if (app.stato === 'Completato' && ultimiGiorni[app.data] !== undefined) {
                        ultimiGiorni[app.data] += parseFloat(app.servizio_costo) || 0;
                    }
                });
                labels = Object.keys(ultimiGiorni).map(d => {
                    const dateObj = new Date(d);
                    return dateObj.toLocaleDateString('it-IT', { day: 'numeric', month: 'short' });
                });
                data = Object.values(ultimiGiorni);
                labelGrafico = 'Incasso Giornaliero (€)';
            }

            storicoChartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: labelGrafico,
                        data: data,
                        backgroundColor: 'rgba(212, 175, 55, 0.5)', // Brass con opacità
                        borderColor: 'rgba(212, 175, 55, 1)', // Brass solido
                        borderWidth: 1,
                        borderRadius: 4
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        y: {
                            beginAtZero: true,
                            grid: {
                                color: 'rgba(255, 255, 255, 0.1)'
                            },
                            ticks: {
                                color: '#f5f5dc' // Cream
                            }
                        },
                        x: {
                            grid: {
                                display: false
                            },
                            ticks: {
                                color: '#f5f5dc' // Cream
                            }
                        }
                    },
                    plugins: {
                        legend: {
                            labels: {
                                color: '#f5f5dc' // Cream
                            }
                        }
                    }
                }
            });
        }
    </script>
</body>
</html>
